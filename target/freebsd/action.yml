name: "Build Xlibre driver against XLibre xserver (FreeBSD)"
inputs:
    xserver-version:
        description: "Which Xserver version / ref to build against"
        required: true

runs:
    using: "composite"
    steps:
        - name:  clone driver repo
          uses:  actions/checkout@v4

        # A new key each week saves the packages pkg updated since.
        - name:  pkg cache week
          id:    pkg-cache-week
          shell: bash
          run:   echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

        # The VM gets the workspace by rsync and copies it back, so pkg's
        # downloads in .pkg-cache (see run-build.sh) survive the job.
        - name:  pkg cache
          uses:  actions/cache@v4
          with:
            key:  driver-build-freebsd-pkg-cache-${{ steps.pkg-cache-week.outputs.week }}
            restore-keys: driver-build-freebsd-pkg-cache-
            path: .pkg-cache

        - name:  check out xserver repo
          uses:  actions/checkout@v4
          with:
            repository: X11Libre/xserver
            path:       xserver-sdk
            ref:        ${{ inputs.xserver-version }}

        - shell: bash
          run:   cp -R --preserve ../../_actions .actions

        - name: run in freebsd VM
          id:   xserver-build
          uses: vmactions/freebsd-vm@v1
          with:
              usesh:   true
              release: "14.3"
              run: |
                set -x
                cp -R .actions /home/runner/work/_actions
                ${{ github.action_path }}/scripts/run-build.sh
